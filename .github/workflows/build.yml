name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least-privilege GITHUB_TOKEN: the build only needs to read the repo.
# Artifact upload uses the run's own storage and needs no repo write scope.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [ '17', '21' ]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: Build and test
        run: mvn -B verify -P coverage-check

      - name: Upload JaCoCo reports
        if: always() && matrix.java == '21'
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-reports
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore

  # The published modules must keep building on the newer Spring AI lines.
  # The samples are left out: they call provider APIs that differ between lines.
  spring-ai-compat:
    name: ${{ matrix.line }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: Spring AI 1.1
            versions: -Dspring-ai.version=1.1.8
          - line: Spring AI 2.1 on Spring Boot 4.2
            versions: -Dspring-boot.version=4.2.0 -Dspring-ai.version=2.1.0 -Dtomcat.version=11.0.27 -Dmcp.version=2.2.0
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and test the published modules
        run: mvn -B verify -pl '!agentflow4j-samples' ${{ matrix.versions }}
